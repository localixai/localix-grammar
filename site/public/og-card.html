<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Social card</title>
  <!-- The source of og.png, the picture a link preview shows. Edit the words or the still, then
       render it at twice 1200×630 with a headless browser:
       chrome --headless --hide-scrollbars --force-device-scale-factor=2 --screenshot=public/og.png --window-size=1200,630 public/og-card.html -->
  <style>
    @font-face { font-family: 'Display'; src: url(fonts/dm-sans.woff2) format('woff2'); font-weight: 100 1000; }
    @font-face { font-family: 'Text'; src: url(fonts/inter.woff2) format('woff2'); font-weight: 100 900; }
    @font-face { font-family: 'Mono'; src: url(fonts/jetbrains-mono.woff2) format('woff2'); font-weight: 100 800; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #050505; color: #f4f4f2; }
    body { position: relative; }
    .og-head { position: absolute; left: 80px; top: 48px; }
    .og-name { font: 600 58px/1 'Display', sans-serif; letter-spacing: -0.04em; }
    .og-tag { margin-top: 18px; color: #b0b0ad; font: 400 26px/1.35 'Text', sans-serif; letter-spacing: -0.01em; }
    .og-url { position: absolute; right: 80px; top: 64px; color: #8b8b87; font: 400 20px/1 'Mono', monospace; }
    /* The extension in a web editor, framed on the draft and the panel of tracked changes beside
       it: the screenshot at half its size, its left edge and its top cut away. */
    .og-frame { position: absolute; left: 40px; top: 188px; width: 1120px; height: 470px; overflow: hidden; border: 1px solid #2a2a28; border-radius: 20px; }
    .og-shot { position: absolute; left: -160px; top: -318px; width: 1280px; }
  </style>
</head>
<body>
  <div class="og-head">
    <div class="og-name">Localix Grammar</div>
    <div class="og-tag">A precise, privacy-aware proofreader for Chrome</div>
  </div>
  <div class="og-url">grammar.localix.ai</div>
  <div class="og-frame"><img class="og-shot" src="shots/overlay-dark.png" alt=""></div>
</body>
</html>
