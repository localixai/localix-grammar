<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Draft</title>
    <!-- The stage the overlay screenshot is taken on: a schematic dark page, where everything
         around the one real field is drawn as placeholder bars, so the eye goes to the text and
         the extension's panel. Not a test fixture: tests/fixtures is. -->
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background:
          radial-gradient(ellipse 60% 50% at 78% 92%, rgba(105, 192, 127, 0.2), transparent 70%),
          radial-gradient(ellipse 55% 45% at 10% 0%, rgba(90, 137, 230, 0.16), transparent 70%),
          radial-gradient(circle, rgba(255, 255, 255, 0.06) 1px, transparent 1.2px) 0 0 / 22px 22px,
          #060607;
        color: #ededee;
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          Inter,
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .window {
        position: absolute;
        left: 9%;
        right: 9%;
        top: 56px;
        bottom: -40px;
        display: grid;
        grid-template-rows: 44px 1fr;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 18px;
        background: linear-gradient(180deg, #111113, #0c0c0d 40%);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.6),
          0 50px 120px -40px rgba(0, 0, 0, 0.9),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        overflow: hidden;
      }
      .chrome {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .dots {
        display: flex;
        gap: 7px;
      }
      .dots i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #2a2a2e;
      }
      .url {
        width: 300px;
        height: 24px;
        margin: 0 auto;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
      }
      .content {
        display: grid;
        grid-template-columns: clamp(140px, 15vw, 190px) 1fr;
        min-height: 0;
      }
      .side {
        padding: 26px 18px;
        border-right: 1px solid rgba(255, 255, 255, 0.05);
      }
      .bar {
        height: 9px;
        margin-bottom: 16px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.07);
      }
      .bar.on {
        background: rgba(255, 255, 255, 0.16);
      }
      .page {
        padding: 44px clamp(40px, 5.5vw, 72px) 0;
      }
      .title {
        width: 44%;
        height: 18px;
        margin: 14px 0 30px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.18);
      }
      #editor {
        display: block;
        width: 100%;
        height: 150px;
        resize: none;
        padding: 18px 20px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 14px;
        outline: none;
        background: rgba(255, 255, 255, 0.025);
        color: #f1f1f2;
        font: inherit;
        font-size: 17px;
        line-height: 1.65;
        letter-spacing: -0.005em;
        box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.025);
      }
      .after {
        margin-top: 26px;
      }
      /* The README's smaller window: the field rises so the panel opens below it. */
      @media (max-height: 700px) {
        .window {
          top: 32px;
        }
        .page {
          padding-top: 26px;
        }
        .title {
          margin: 10px 0 20px;
        }
        #editor {
          height: 128px;
        }
      }
    </style>
  </head>
  <body>
    <div class="window">
      <div class="chrome">
        <div class="dots"><i></i><i></i><i></i></div>
        <div class="url"></div>
      </div>
      <div class="content">
        <div class="side">
          <div class="bar on" style="width: 70%"></div>
          <div class="bar" style="width: 85%"></div>
          <div class="bar" style="width: 60%"></div>
          <div class="bar" style="width: 75%"></div>
          <div class="bar" style="width: 50%; margin-top: 30px"></div>
          <div class="bar" style="width: 80%"></div>
          <div class="bar" style="width: 65%"></div>
          <div class="bar" style="width: 45%; margin-top: 30px"></div>
          <div class="bar" style="width: 72%"></div>
          <div class="bar" style="width: 58%"></div>
        </div>
        <div class="page">
          <div class="bar" style="width: 18%"></div>
          <div class="title"></div>
          <textarea id="editor" aria-label="Draft" spellcheck="false"></textarea>
          <div class="after">
            <div class="bar" style="width: 46%"></div>
            <div class="bar" style="width: 40%"></div>
            <div class="bar" style="width: 44%"></div>
            <div class="bar" style="width: 30%"></div>
            <div class="bar" style="width: 14%; margin-top: 34px"></div>
            <div class="bar" style="width: 42%"></div>
            <div class="bar" style="width: 36%"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
